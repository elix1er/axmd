name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Universal macOS Binary
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Universal Binary (arm64 + x86_64)
        run: |
          swiftc -O -target arm64-apple-macos13.0 axmd.swift -o axmd-arm64
          swiftc -O -target x86_64-apple-macos13.0 axmd.swift -o axmd-x86_64
          lipo -create -output axmd axmd-arm64 axmd-x86_64
          strip -S -x axmd
          file axmd

      - name: Smoke Test CLI & Shell Scripts
        run: |
          ./axmd 2>&1 | grep -q "usage: axmd" || true
          zsh -n skills/axmd-computer-use/scripts/loop.sh

      - name: Package Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist/axmd-${VERSION}-macos-universal
          cp axmd README.md LICENSE dist/axmd-${VERSION}-macos-universal/
          cp -R skills dist/axmd-${VERSION}-macos-universal/
          tar -C dist -czf axmd-${VERSION}-macos-universal.tar.gz axmd-${VERSION}-macos-universal
          shasum -a 256 axmd-${VERSION}-macos-universal.tar.gz > axmd-${VERSION}-macos-universal.tar.gz.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            axmd-*-macos-universal.tar.gz
            axmd-*-macos-universal.tar.gz.sha256
